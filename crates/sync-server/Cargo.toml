[package]
name = "quiet_sync_server"
version = "0.1.16"
edition = "2024"
description = "Self-hostable real-time sync server for Quiet.md"
license = "MIT"
authors = ["s1dashu", "10166"]
repository = "https://github.com/10166/quiet-md"

[[bin]]
name = "quiet-sync-server"
path = "src/main.rs"

[dependencies]
quiet_sync_proto = { path = "../sync-proto" }
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true
