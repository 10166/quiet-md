[package]
name = "quiet_sync_proto"
version = "0.1.15"
edition = "2024"
description = "Wire protocol, sync entities, and E2EE primitives for Quiet.md sync"
license = "MIT"
authors = ["s1dashu", "10166"]
repository = "https://github.com/10166/quiet-md"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
miniz_oxide = "0.9"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[lints]
workspace = true
