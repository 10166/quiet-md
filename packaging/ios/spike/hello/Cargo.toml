# Spike (docs/design/mobile.md §7): upstream gpui_ios example against the vendored GPUI.
[package]
name = "gpui_ios_hello"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(target_os = "ios")'.dependencies]
gpui = { path = "../../../../vendor/zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../../../vendor/zed/crates/gpui_platform", default-features = false, features = ["font-kit"] }
gpui_ios = { path = "../../../../vendor/zed/crates/gpui_ios" }
