services:
  quiet-sync:
    build:
      context: ../..
      dockerfile: crates/sync-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - quiet_sync_data:/data
    environment:
      QUIET_SYNC_BIND: "0.0.0.0:8787"
      QUIET_SYNC_DATA_DIR: "/data"
      QUIET_SYNC_ALLOW_REGISTER: "true"
      # QUIET_SYNC_NODE_NAME: "Primary-Server"
      # QUIET_SYNC_PUBLIC_URL: "https://sync.example.com"
      # QUIET_SYNC_ADMIN_PASSWORD: "change-me-strong-password"
      # QUIET_SYNC_INVITE_CODE: "your-private-invite-code"
      # QUIET_SYNC_JWT_SECRET: "set-a-long-random-secret"

volumes:
  quiet_sync_data:
